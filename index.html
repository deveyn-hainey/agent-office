<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Grok Bot Office</title>
<meta name="description" content="Live 3D office view of Deveyn Hainey's AI agents.">
<link rel="stylesheet" href="css/style.css">
<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
  }
}
</script>
</head>
<body>
<div id="app">
  <div id="stage"></div>
  <div id="fallback" hidden>
    <div class="card">
      <h2>3D view unavailable</h2>
      <p>The 3D office couldn't start (WebGL or the three.js CDN is unavailable). The status panels still work.</p>
    </div>
  </div>

  <div id="topleft">
    <div class="card brand">
      <div class="logo"></div>
      <div class="brand-text">
        <b>Grok Bot Office</b>
        <span class="live" id="live"><i></i><em id="liveLabel">Live</em> · <span id="updated">--:--</span></span>
      </div>
      <div class="stale" id="stale" hidden></div>
    </div>
    <button class="card tour" id="tour" aria-pressed="false"><span id="tourIcon">▶</span> Tour</button>
  </div>

  <div id="topcenter">
    <div class="card counts" id="counts"></div>
    <div class="card toast" id="toast" hidden></div>
  </div>

  <aside id="left" class="panel">
    <section class="card floors"><div class="fhead"><span>Floors</span><span id="floorCount">0</span></div><div id="floorList"></div></section>
    <section class="card coll open" id="cWait"><button class="chead"><span>Waiting on me</span><span class="badge" id="waitBadge">0</span><svg viewBox="0 0 10 6"><path d="M1 1l4 4 4-4" fill="none" stroke="currentColor" stroke-width="1.5"/></svg></button><div class="cbody" id="waitBody"></div></section>
    <section class="card coll" id="cFin"><button class="chead"><span>Finished</span><span class="badge" id="finBadge">0</span><svg viewBox="0 0 10 6"><path d="M1 1l4 4 4-4" fill="none" stroke="currentColor" stroke-width="1.5"/></svg></button><div class="cbody" id="finBody"></div></section>
    <section class="card coll" id="cRou" hidden><button class="chead"><span>Routines</span><span class="badge" id="rouBadge">0</span><svg viewBox="0 0 10 6"><path d="M1 1l4 4 4-4" fill="none" stroke="currentColor" stroke-width="1.5"/></svg></button><div class="cbody" id="rouBody"></div></section>
  </aside>

  <aside id="right" class="panel">
    <section class="card floorcard">
      <div class="banner"><div><div class="bname" id="bName">-</div><div class="bbig"><b id="bWorking">0</b> working</div></div><div class="bsub" id="bSub"></div></div>
      <div id="agentList"></div>
    </section>
  </aside>

  <section class="card" id="activity"><h3>Activity</h3><div id="actList"></div></section>
  <section class="card" id="usage" hidden></section>

  <div id="hint"><span><kbd>Drag</kbd> rotate</span><span><kbd>Right-drag</kbd> <kbd>WASD</kbd> move</span><span><kbd>Scroll</kbd> zoom</span><span><kbd>↑</kbd><kbd>↓</kbd> floors</span></div>
  <div id="zoom"><button class="card" id="zin" aria-label="Zoom in">+</button><button class="card" id="zout" aria-label="Zoom out">−</button></div>
  <nav id="mnav"><button class="card" data-d="left">Floors</button><button class="card" data-d="right">Agents</button><button class="card" data-d="activity">Activity</button></nav>

  <div id="detailBack" hidden></div>
  <div class="card" id="detail" hidden></div>
</div>

<script>
  window.aoFail = function (msg) {
    var f = document.getElementById('fallback');
    if (f) { f.hidden = false; if (msg) f.querySelector('p').textContent = msg; }
  };
</script>
<script type="module" src="js/main.js" onerror="aoFail()"></script>
</body>
</html>
